name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Testes unitários e de API
        run: npm test

      - name: Build de produção
        run: npm run build

  e2e-e-docker:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências e compilar
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
          npm run build

      - name: Auditoria de dependências de produção
        run: |
          npm --prefix backend audit --omit=dev --audit-level=high
          npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Teste E2E no navegador (Chrome + servidor de produção)
        run: npm run test:e2e

      - name: Testar build e inicialização do container Docker
        run: |
          docker build -t twcin:ci .
          docker run -d --name twcin-ci-smoke -p 127.0.0.1:3399:3333 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            twcin:ci
          trap 'docker rm -f twcin-ci-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3399/api/health; then
              echo ""
              exit 0
            fi
            sleep 1
          done
          docker logs twcin-ci-smoke
          exit 1
